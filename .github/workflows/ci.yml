name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse_dev
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://civicpulse:civicpulse_dev@localhost:5432/civicpulse

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Run database migration
        run: |
          npm install -g pg-client 2>/dev/null || true
          PGPASSWORD=civicpulse_dev psql -h localhost -U civicpulse -d civicpulse -f db/migrations/001_init.sql

      - name: Run database seed
        run: |
          PGPASSWORD=civicpulse_dev psql -h localhost -U civicpulse -d civicpulse -f db/seed/001_seed.sql

      - name: Run RLS tests
        working-directory: apps/api
        run: npm test